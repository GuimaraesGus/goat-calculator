<style>

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}

/* ---------- metade do placar ---------- */
.half{position:relative;border-radius:14px;overflow:hidden;container-type:size;display:grid;gap:4px 10px;padding:6px 10px 8px}

/* paisagem: fichas à esquerda, vida no centro, oponente à direita */
.half{grid-template-columns:minmax(0,1.15fr) minmax(0,1.5fr) minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"nm tm opp hb" "chips lp opp ."}
.tm{grid-area:tm;justify-self:center;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);font-size:15px;font-weight:600}

.lp:active{background:rgba(0,0,0,.05)}
.lp .n{font-weight:650;font-size:calc(clamp(36px,min(52cqh,22cqw),170px)*var(--k,1))}

.lp.dead .n{color:var(--red)!important}

.chips{grid-area:chips;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;overflow-y:auto;scrollbar-width:none;min-height:0}
.chips::-webkit-scrollbar{display:none}
.ochips .more,.chips .more{position:sticky;right:0;flex:none;align-self:center;width:30px;height:30px;margin-left:-30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border-strong);box-shadow:-10px 0 12px 2px var(--bg);color:var(--text);pointer-events:none;opacity:0;z-index:1}
.ochips .more svg,.chips .more svg{width:16px;height:16px}
.p0 .chips .more,.p1 .ochips .more{color:var(--p1)}.p1 .chips .more,.p0 .ochips .more{color:var(--p2)}

.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}

.oppw{grid-area:opp;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:5px;min-width:0;min-height:0}
.orow{display:flex;align-items:center;gap:5px;max-width:100%;min-width:0;justify-content:flex-end}
.ochips.none{display:none!important}
.orow .oadd{flex:none;width:32px;height:28px;font-size:18px}
.ochips{justify-self:end;min-width:0;align-self:flex-end;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;max-width:100%;min-height:0}

.ochips{align-items:center}
.ochips .more,.ochips .less{width:24px;height:24px}.ochips .more{margin-left:-24px}.ochips .less{margin-right:-24px}
.ochips .chip.add{width:32px;font-size:18px}
.ochips .chip{height:28px;padding:0 8px;gap:4px}
.ochips .chip svg{width:19px;height:19px}
.ochips .chip b{font-size:13px}
.oname{max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (orientation:portrait){.opp .oname{max-width:none}}
.opp{width:100%;max-width:200px;background:var(--surface-2);border-radius:10px;padding:6px 10px;text-align:right}
.p0 .opp{border:1px solid var(--p2line)}.p1 .opp{border:1px solid var(--p1line)}
.opp .lab{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}

@media (orientation:landscape){.half{row-gap:6px}.half .chips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;align-self:start;min-height:0}.half .opp{max-width:none;padding:4px 10px}.half .opp .v{font-size:calc(clamp(18px,20cqh,34px)*var(--k,1))}.half .oppw{align-self:stretch}.half{row-gap:4px}.half .hb{width:30px;height:30px}.half .lp .d{line-height:1.1}}
/* retrato: tudo empilhado e centralizado */
@media (orientation:portrait){
  .half{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"nm tm hb" "chips chips chips" "lp lp lp" "opp opp opp";padding:8px 10px 10px}
  .chips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;min-height:36px}

.bar{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--border);border-radius:10px;background:var(--surface-1)}
.bar button{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.bar button svg{width:22px;height:22px}
.note{position:absolute;left:50%;bottom:8px;transform:translateX(-50%) translateY(150%);transition:transform .25s;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:14px;max-width:92%;white-space:nowrap;z-index:5;pointer-events:none}

/* ---------- telas cheias ---------- */
.ov{position:fixed;inset:0;z-index:20;display:none;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}

.k{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface-2);font-size:clamp(18px,4.5vmin,28px);line-height:1.1}

/* calculadora: paisagem */
#calc .wrap{height:100%;display:grid;gap:8px;grid-template-columns:minmax(110px,.9fr) minmax(0,2.2fr) minmax(150px,1.3fr);grid-template-rows:1fr 1fr 1.3fr .8fr;grid-template-areas:"ts pad sc" "to pad sc" "val pad sc" "back pad sc"}

.tgt{display:flex;flex-direction:column;justify-content:center;padding:0 10px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface-2);text-align:left;font-size:12px;color:var(--muted)}

#val{display:flex;align-items:center;justify-content:flex-end;padding:0 12px;border:1px dashed var(--border-strong);border-radius:var(--r);font-size:clamp(26px,7vmin,42px);font-weight:500;overflow:hidden;white-space:nowrap}

.tgt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.tgt span i{font-style:normal;font-weight:400;opacity:.8}
#kDel{background:#f3cf6e!important;border:1.5px solid #c9932a!important;color:#4a3104!important;font-size:26px!important}

#val.cease{border-color:var(--red);border-style:solid}
.s.arm{border:2px solid var(--red)!important;border-style:solid!important;background:var(--redbg)}
.s.arm b{color:var(--red)}
.s{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:0 4px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface-2);text-align:center}

.s.v{border-style:dashed}.s.v b{color:var(--text);font-size:12px;font-weight:500}

@media (orientation:portrait){
  #calc .wrap{grid-template-columns:1fr 1fr;grid-template-rows:62px 64px minmax(0,1fr) 150px 44px;grid-template-areas:"ts to" "val val" "pad pad" "sc sc" "back back"}

 .chead{flex-direction:row;align-items:center;gap:12px}.chead .tabs{flex:1;max-width:420px;margin-left:auto}

 .cname{font-size:14px}.step button{height:32px}.step b{font-size:20px}.cdesc{font-size:11.5px;padding:6px 8px}.cbody{grid-template-columns:minmax(0,1fr) minmax(220px,.7fr)}#create .cdesc{font-size:11.5px;line-height:1.3}
 .go{height:42px}.ghost{height:36px}
 .ic svg{width:clamp(22px,7vmin,40px);height:clamp(22px,7vmin,40px)}
